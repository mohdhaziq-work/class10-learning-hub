name: Android APK Build

# Builds the WebView shell APK on demand (free GitHub-hosted runner).
# Download the artifact and place it at public/downloads/class10-learning-hub.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/class10-learning-hub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: class10-learning-hub-apk
          path: android-app/out/class10-learning-hub.apk
