name: Android APK Build

# Builds the WebView shell APK on android-app changes, then commits the fresh
# APK back into public/downloads/ so the site serves it automatically.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Place APK in site downloads
        run: |
          mkdir -p ../public/downloads
          cp app/build/outputs/apk/debug/app-debug.apk ../public/downloads/class10-learning-hub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: class10-learning-hub-apk
          path: public/downloads/class10-learning-hub.apk

      - name: Commit fresh APK back to repo
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/class10-learning-hub.apk
          git diff --cached --quiet || { git commit -m "ci: fresh APK build" && git pull --rebase origin main && git push; }
