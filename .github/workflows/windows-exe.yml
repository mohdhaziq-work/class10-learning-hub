name: Windows Desktop Build

# Builds the Electron portable .exe and publishes it as a GitHub Release.
# Runs automatically when desktop-app changes, or manually:
# Actions tab -> "Windows Desktop Build" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop-app/**", ".github/workflows/windows-exe.yml"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build portable exe
        run: npx electron-builder --win portable

      - name: Show dist output
        run: dir dist

      - name: Publish release (gh CLI, with retry)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          EXE=$(ls Class10-Learning-Hub-Windows.exe 2>/dev/null || ls *.exe | head -1)
          echo "uploading $EXE"
          for i in 1 2 3; do
            gh release create "desktop-v${{ github.run_number }}" \
              --title "Windows App (build ${{ github.run_number }})" \
              --notes "Portable Windows app for Class 10 Learning Hub. Download the exe and double-click to run." \
              "$EXE" && exit 0
            echo "attempt $i failed, retrying..."; sleep 5
          done
          exit 1

      - name: Upload exe as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class10-learning-hub-windows
          path: desktop-app/dist/*.exe
